<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b0b08" />
    <meta
      name="description"
      content="Akshauhini is assembling. The journey begins soon."
    />
    <title>Akshauhini — Coming Soon</title>
    <link
      rel="preload"
      href="assets/caudex-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b0b08'/%3E%3Cpath d='M32 9 52 53h-9l-4-10H25l-4 10h-9L32 9Zm0 16-4 11h8l-4-11Z' fill='%23f4c879'/%3E%3C/svg%3E"
    />
    <style>
      @font-face {
        font-family: "Caudex";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("assets/caudex-latin-700.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #1b0b08;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background: #1b0b08;
      }

      .backdrop,
      .backdrop img {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .backdrop {
        z-index: 0;
        background: #1b0b08;
      }

      .backdrop img {
        object-fit: cover;
        object-position: 50% 50%;
        filter: saturate(0.96) contrast(1.03);
      }

      .page {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100svh;
        place-items: end center;
        padding: clamp(2rem, 7vh, 5.5rem) 1.5rem;
        isolation: isolate;
      }

      .page::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        background:
          linear-gradient(180deg, rgb(12 5 3 / 0.08) 30%, rgb(12 5 3 / 0.72) 100%),
          radial-gradient(circle at center, transparent 42%, rgb(12 5 3 / 0.34) 100%);
        content: "";
        pointer-events: none;
      }

      .announcement {
        width: min(100%, 62rem);
        color: #fff8e7;
        text-align: center;
        text-shadow: 0 0.15rem 1.5rem rgb(0 0 0 / 0.8);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        margin: 0 0 0.8rem;
        color: #f4c879;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(0.78rem, 1.2vw, 0.95rem);
        font-weight: 650;
        letter-spacing: 0.34em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        width: clamp(2rem, 8vw, 6rem);
        height: 1px;
        background: linear-gradient(90deg, transparent, currentcolor);
        content: "";
      }

      .eyebrow::after {
        background: linear-gradient(90deg, currentcolor, transparent);
      }

      h1 {
        margin: 0;
        font-family: "Caudex", Georgia, "Times New Roman", serif;
        font-size: clamp(2.75rem, 8vw, 6.75rem);
        font-weight: 700;
        letter-spacing: 0.035em;
        line-height: 0.95;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 1rem auto 0;
        color: rgb(255 248 231 / 0.88);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(1rem, 1.8vw, 1.15rem);
        letter-spacing: 0.08em;
        line-height: 1.6;
      }

      @media (max-width: 42rem) {
        .backdrop img {
          object-position: 37% 50%;
        }

        .page {
          padding-right: 1rem;
          padding-bottom: max(2.25rem, env(safe-area-inset-bottom));
          padding-left: 1rem;
        }

        h1 {
          font-size: clamp(2.2rem, 9.5vw, 4.4rem);
          letter-spacing: 0.005em;
        }

        .subtitle {
          max-width: 22rem;
        }
      }

      @media (prefers-reduced-data: reduce) {
        .backdrop img {
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <picture class="backdrop" aria-hidden="true">
      <source
        media="(max-width: 48rem)"
        type="image/avif"
        srcset="assets/background-960.avif"
      />
      <source
        media="(max-width: 48rem)"
        type="image/webp"
        srcset="assets/background-960.webp"
      />
      <source
        media="(max-width: 48rem)"
        type="image/jpeg"
        srcset="assets/background-960.jpg"
      />
      <source type="image/avif" srcset="assets/background-1774.avif" />
      <source type="image/webp" srcset="assets/background-1774.webp" />
      <img
        src="assets/background-1774.jpg"
        alt=""
        width="1774"
        height="887"
        fetchpriority="high"
      />
    </picture>

    <main class="page">
      <section class="announcement" aria-labelledby="site-title">
        <p class="eyebrow">Coming soon</p>
        <h1 id="site-title">Akshauhini</h1>
        <p class="subtitle">A new chapter is assembling.</p>
      </section>
    </main>
  </body>
</html>
